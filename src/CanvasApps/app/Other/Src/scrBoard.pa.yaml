      - btnStart:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: |+
              =//If(IsBlank(rdPQS.Selected),DisplayMode.Disabled,DisplayMode.Edit)

            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |
              =Set(
                  varTech,
                  txtTech
              );
              Set(
                  varMng,
                  txtManager
              );
              Set(
                  varSup,
                  txtSupervisor
              );
              Set(
                  varBoardType,
                  rdPQS.SelectedText
              );
              Clear(colPQSGrade);
              Clear(colWIGrade);
              //Creates the Report
              Set(
                  varBoardSessionID,
                  Text(GUID())
              );
              Set(
                  varVenueSelected,
                  ddVenue.SelectedText.Value
              )
              ;
              Navigate(scrFullON);Reset(txtWIAnswer);Reset(txtWIQuestion);Reset(drWIMod);


              Set(VarSessionID,
              SessionPatch.Run(  
                  varTech.Text,
                  varMng.Text,
                  varSup.Text,
                  varVenueSelected,
                  Text(Now())
              ).sessionid)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="Start"
            Visible: =!IsBlank(rdPQS.Selected.Value)&& !IsBlank(txtSupSSO.Text)&& !IsBlank(txtManagerSSO.Text) &&!IsBlank(txtTechSSO.Text)
            X: =580
            Y: =528
