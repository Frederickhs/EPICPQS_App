Screens:
  scrBoard:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Reset(rdPQS);Reset(txtSupSSO);Reset(txtManagerSSO);Reset(txtTech);Reset(txtTechSSO)
    Children:
      - Image1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =768
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            Image: ='UEU-Logo-Nebula-BG_AdobeStock_209086800'
            ImagePosition: =ImagePosition.Fill
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =1366
      - galMods:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =251
            Items: =Distinct(varQuestionSource,Mod.Value)
            TemplateSize: =47
            Visible: =rdPQS.Selected.Value = "Partial PQS"
            Width: =119
            X: =865
            Y: =328
          Children:
            - Checkbox4:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  CheckboxBorderColor: =RGBA(96, 94, 92, 1)
                  CheckmarkFill: =RGBA(0, 120, 212, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(rdPQS.Selected.Value = "Full PQS", DisplayMode.Disabled, DisplayMode.Edit)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(50, 49, 48, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnCheck: =Collect(colActiveMods,ThisItem)
                  OnUncheck: =Remove(colActiveMods,ThisItem)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Size: =10
                  Text: ="Mod " & ThisItem.Value
                  Width: =100
                  X: =20
                  Y: =12
