      - rdReview:
          Control: Classic/Radio@2.3.0
          Properties:
            BorderColor: =RGBA(50, 49, 48, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(255, 255, 255, 1)
            Default: =Blank()
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Items: |
              =["Trainer Review", "Supervisor Review"]
            Items.Value: =Value
            OnChange: =ClearCollect(colActiveMods,Distinct(varQuestionSource, Mod.Value))
            PaddingBottom: =5
            PaddingTop: =5
            PressedColor: =RGBA(50, 49, 48, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadioBorderColor: =RGBA(50, 49, 48, 1)
