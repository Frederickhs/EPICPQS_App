    btnStartReview As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Fill: =RGBA(0, 120, 212, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: |
            =Set(
                varRTech,
                txtRTech
            );
            Set(
                varRSup,
                txtRSup
            );
            Set(
                varReviewType,
                rdReview.Selected.Value
            );
            Clear(colPQSRGrade);
            Navigate(scrReview);
            //Creates the Report
            Set(
                varBoardSessionID,
                Text(GUID())
            );
            Set(
                varVenueSelected,
                ddVenue.SelectedText.Value
            );
            //Patch Report
            Set(VarSessionID,
            SessionPatch.Run(  
                varRTech.Text,
                "Review",
                varRSup.Text,
                varVenueSelected,
                Text(Now())
            ).sessionid)
        PressedBorderColor: =RGBA(0, 69, 120, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
        PressedFill: =RGBA(16, 110, 190, 1)
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =15
        Text: ="Start Review"
        Visible: =!IsBlank(rdReview.Selected.Value)
        X: =603
        Y: =661
        ZIndex: =11

