    "'lbl%' As label":
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        Fill: |-
            =If(varCorrect >= 80, ColorFade(ColorValue("#107c10"),85%),ColorFade(ColorValue("#d13438"),70%))
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =32
        Size: =10
        Text: |-
            ="Correct Answers: " & varCorrect & "%"
        Width: =160
        X: =1164
        Y: =30
        ZIndex: =4

    lblResult As label:
        Align: =Align.Center
        BorderColor: =Color.Black
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        Fill: |-
            =If(varCorrect >= 80, ColorFade(ColorValue("#107c10"),10%),ColorFade(ColorValue("#d13438"),5%))
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =32
        Text: =varBoardStatus
        Width: =98
        X: =1050
        Y: =30
        ZIndex: =5

    btnExit As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Fill: =RGBA(255, 0, 0, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: =Reset(varTech);Reset(varSup);Reset(varMng);Clear(colActiveMods);Clear(colWIGrade);Clear(colPQSGrade);Navigate(scrVenue);
        PressedBorderColor: =RGBA(0, 69, 120, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
        PressedFill: =RGBA(16, 110, 190, 1)
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =15
        Text: ="Exit"
        X: =1164
        Y: =701
        ZIndex: =6

    htmlInfo As htmlViewer:
        AutoHeight: =true
        DisabledBorderColor: =RGBA(161, 159, 157, 1)
        Font: =Font.'Segoe UI'
        Height: =88
        HtmlText: |-
            =//"Manager: " & txtManager.Text & Char(10) & "Supervisor: " & txtSupervisor.Text & Char(10) & "Tech: " & txtTech.Text
            
            "<b>Manager: </b>" & txtManager.Text &  " - " & txtManagerSSO.Text &"<br><b>Supervisor: </b>" & txtSupervisor.Text & " - " & txtSupSSO.Text & "<br><b>Tech: </b>" & txtTech.Text & " - " & txtTechSSO.Text
        Size: =13
        Width: =443
        X: =26
        Y: =680
        ZIndex: =7

