        ZIndex: =1

    "galResult As gallery.'BrowseLayout_Vertical_TwoTextVariant_ver5.0'":
        DelayItemLoading: =true
        Height: =538
        Items: |-
            =SortByColumns(
                Filter(
                    colPQSQ As q,
                    !IsBlank(
                        LookUp(
                            colPQSGrade,
                            QuestionID = q.ID
                        )
                    )
                ),
                "QNumber",
                SortOrder.Ascending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =90
        Width: =817
        X: =40
        Y: =122
        ZIndex: =2

        lblFinalQuestion As label:
            Color: =RGBA(50, 49, 48, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =0
            PaddingTop: =0
            Text: =ThisItem.Question
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 86
            X: =16
            Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + lblFinalAnswer.Size * 1.8)) / 2
            ZIndex: =2

        lblFinalMod As label:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Height: =28
            Size: =13
            Text: |-
                ="PQS Mod: " & ThisItem.Mod.Value
            X: =579
            Y: =50
            ZIndex: =3

        lblFinalAnswer As label:
            Color: =RGBA(96, 94, 92, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Fill: |-
                =If(LookUp(colPQSGrade,QuestionID=ThisItem.ID).IsCorrect="Correct",ColorFade(ColorValue("#107C10"),85%),ColorFade(ColorValue("#D13438"),85%))
            Font: =Font.'Segoe UI'
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =24
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: =LookUp(colPQSGrade,QuestionID = ThisItem.ID).IsCorrect
            VerticalAlign: =VerticalAlign.Top
            Width: =78
            X: =lblFinalQuestion.X
            Y: =lblFinalQuestion.Y + lblFinalQuestion.Height
            ZIndex: =4

        Separator15 As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 1)
            Height: =8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =6

        Rectangle17 As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Height: =Parent.TemplateHeight - Separator15.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =7

    lblPQSResult As label:
        Align: =Align.Center
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(255, 255, 255, 1)
